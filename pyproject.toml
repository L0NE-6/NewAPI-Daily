[project]
name = "newapi-daily"
version = "1.0.0"
description = "New API daily check-in runner with proof-of-work and strict server readback"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31,<3",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
